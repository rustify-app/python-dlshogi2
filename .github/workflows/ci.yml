name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # tests/ は cshogi / numpy / torch を使う。torch は CPU 版 (GPU 版は数 GB ある)
      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # torch/cshogi無しではimportできないため、構文チェックに留める
      - name: Byte-compile every module
        run: python -m compileall -q pydlshogi2 utils tests

      - name: Check shell scripts
        run: |
          for script in scripts/*.sh wiki/*.sh; do
              echo "checking $script"
              bash -n "$script"
          done
