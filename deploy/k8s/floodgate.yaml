# Plays on floodgate with FukauraOu + the r3 model. One login, so exactly one replica.
# --ponder: searches the expected reply on the opponent's time (go ponder / ponderhit / stop).
# CSA_* come from the Secret floodgate-csa (Infisical Rustify prod /floodgate, see
# deploy/provision-secrets.py). Uses one of the time-sliced office GPU slots.
#
# Nothing large goes through Zot:
#   - app  (init): copies the engine + client from the small zot image dlshogi/floodgate.
#   - env  (init): installs cshogi and the TensorRT / CUDA runtime wheels from PyPI into
#     /data/env/<hash of FLOODGATE_PIP> on the volume. Skipped when that venv is already there,
#     so it downloads (~4.4GB, mostly tensorrt-cu12-libs) only the first time and after FLOODGATE_PIP changes.
#   - floodgate: the public python image, running the client from that venv.
# TensorRT must stay 10.16.1.11: the engine caches in /data/eval are built for it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floodgate
  namespace: dlshogi
  labels:
    app.kubernetes.io/name: floodgate
    app.kubernetes.io/part-of: dlshogi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: floodgate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floodgate
        app.kubernetes.io/part-of: dlshogi
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: zot-creds
      initContainers:
        - name: app
          image: floodgate
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'cp -a /dist/. /opt/dlshogi/ && ln -s /data/eval /opt/dlshogi/engine/eval && ln -s /data/book /opt/dlshogi/engine/book']
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: app, mountPath: /opt/dlshogi}
        - name: env
          image: docker.io/library/python:3.14-slim-trixie
          imagePullPolicy: IfNotPresent
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              h=$(printf %s "$FLOODGATE_PIP" | sha256sum | cut -c1-16); e=/data/env/$h
              if [ ! -f "$e/.ready" ]; then
                echo "installing $FLOODGATE_PIP into $e"
                rm -rf "$e"
                python -m venv "$e"
                TMPDIR=/piptmp "$e/bin/pip" install --no-cache-dir --extra-index-url https://pypi.nvidia.com $FLOODGATE_PIP
                touch "$e/.ready"
              fi
              ln -sfn "$h" /data/env/floodgate
              # Opening book (YaneuraOu new petabook, MIT): fetched once onto the volume.
              b=/data/book; mkdir -p $b
              if [ ! -f "$b/.$BOOK_NAME" ]; then
                echo "fetching book $BOOK_URL"
                rm -rf /piptmp/book && python -m venv /piptmp/book && /piptmp/book/bin/pip install -q py7zr
                python -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], '/piptmp/book.7z')" "$BOOK_URL"
                /piptmp/book/bin/python -c "import py7zr; py7zr.SevenZipFile('/piptmp/book.7z').extractall('/piptmp/bookx')"
                rm -f $b/*.db && mv "$(find /piptmp/bookx -name '*.db' | head -1)" $b/user_book1.db
                rm -rf /piptmp/book /piptmp/book.7z /piptmp/bookx && touch "$b/.$BOOK_NAME"
              fi
              ls -la $b
          env:
            - {name: BOOK_NAME, value: new_petabook_20250505c}
            - {name: BOOK_URL, value: "https://github.com/yaneurao/YaneuraOu/releases/download/new_petabook233/new_petabook_20250505c.7z"}
            - name: FLOODGATE_PIP
              value: cshogi==1.0.9 tensorrt-cu12-libs==10.16.1.11 nvidia-cuda-runtime-cu12==12.9.79
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 3Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: piptmp, mountPath: /piptmp}
      containers:
        - name: floodgate
          image: docker.io/library/python:3.14-slim-trixie
          imagePullPolicy: IfNotPresent
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              v=/data/env/floodgate; sp=$(echo $v/lib/python3.*/site-packages)
              export LD_LIBRARY_PATH=/opt/dlshogi/lib:$sp/tensorrt_libs:$sp/nvidia/cuda_runtime/lib
              if ldd /opt/dlshogi/engine/FukauraOu | grep 'not found'; then exit 1; fi
              cd /opt/dlshogi/app
              exec $v/bin/python -m pydlshogi2.csa_client --engine /opt/dlshogi/engine/FukauraOu \
                --engine-dir /opt/dlshogi/engine "$@"
            - floodgate
            - --option
            - DNN_Model=r3.onnx
            # Book settings as recommended in the petabook release notes, except BookEvalDiff:
            # 20 instead of 0 so floodgate opponents can't simply replay one line against us.
            - --option
            - BookFile=user_book1.db
            - --option
            - BookOnTheFly=true
            - --option
            - IgnoreBookPly=true
            - --option
            - FlippedBook=true
            - --option
            - BookMoves=999
            - --option
            - BookDepthLimit=0
            - --option
            - BookEvalDiff=20
            # Time: 85 instead of 100. Games that leave the book early used to run down to ~10s of base
            # time by ply 100 and play the rest on the 10s increment (wiki 改善案, 2026-11-02).
            - --option
            - SlowMover=85
            - --ponder
            - --log
            - /data/client.log
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: PYTHONPATH, value: /opt/dlshogi/app}
          envFrom:
            - secretRef:
                name: floodgate-csa
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 4Gi, nvidia.com/gpu: 1}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: app, mountPath: /opt/dlshogi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: floodgate-data
        - name: app
          emptyDir: {}
        # pip's downloads (the TensorRT wheel is 4.3GB) go to node scratch space, not the
        # volume: only the unpacked venv has to fit in floodgate-data.
        - name: piptmp
          emptyDir: {sizeLimit: 8Gi}
