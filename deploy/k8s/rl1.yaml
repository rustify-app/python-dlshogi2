# Self-play RL from checkpoints/checkpoint.pth (was dlshogi-rl1.service on ubuntu-03).
# Resumable: rl_loop.sh skips finished iterations in WORKDIR. It parks between iterations
# while /data/rl1/PAUSE exists:
#   kubectl --context lovekapibarasan-office -n dlshogi exec deploy/dlshogi-rl1 -- touch /data/rl1/PAUSE
#   kubectl --context lovekapibarasan-office -n dlshogi exec deploy/dlshogi-rl1 -- rm /data/rl1/PAUSE
#
# Nothing large goes through Zot:
#   - app  (init): copies the code + native core from the small zot image dlshogi/rl.
#   - env  (init): installs requirements.txt (pinned by deploy-constraints.txt, what ran on
#     ubuntu-03) + onnxruntime-gpu + tensorrt_cu13 from PyPI into /data/env/<hash of those
#     files> on the volume. Skipped when that venv is already there, so the ~8GB download
#     happens only the first time and when the pins change.
#   - rl: the public python image, running rl_loop.sh with that venv.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlshogi-rl1
  namespace: dlshogi
  labels:
    app.kubernetes.io/name: dlshogi-rl1
    app.kubernetes.io/part-of: dlshogi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dlshogi-rl1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dlshogi-rl1
        app.kubernetes.io/part-of: dlshogi
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: zot-creds
      initContainers:
        - name: app
          image: dlshogi-rl
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'cp -a /dist/. /opt/dlshogi/']
          volumeMounts:
            - {name: app, mountPath: /opt/dlshogi}
        - name: env
          image: docker.io/library/python:3.14-slim-trixie
          imagePullPolicy: IfNotPresent
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              a=/opt/dlshogi/app
              h=$(cat $a/requirements.txt $a/deploy-constraints.txt | sha256sum | cut -c1-16); e=/data/env/$h
              if [ ! -f "$e/.ready" ]; then
                echo "installing into $e"
                rm -rf "$e"; mkdir -p /data/env/tmp; export TMPDIR=/data/env/tmp
                python -m venv "$e"; pip="$e/bin/pip install --no-cache-dir -c $a/deploy-constraints.txt"
                $pip -r $a/requirements.txt
                "$e/bin/pip" uninstall -y onnxruntime
                $pip onnxruntime-gpu tensorrt_cu13
                touch "$e/.ready"
              fi
              ln -sfn "$h" /data/env/rl
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: app, mountPath: /opt/dlshogi}
      containers:
        - name: rl
          image: docker.io/library/python:3.14-slim-trixie
          imagePullPolicy: IfNotPresent
          command: [bash, -c]
          # The PAUSED marker from a previous run is stale; PAUSE (if present) still parks the loop.
          args:
            - rm -f /data/rl1/PAUSED && mkdir -p /data/home && cd /opt/dlshogi/app && exec bash rl_loop.sh /data/checkpoints/checkpoint.pth 2>&1 | tee -a /data/rl1/rl.log
          env:
            - {name: PATH, value: /data/env/rl/bin:/usr/local/bin:/usr/bin:/bin}
            - {name: PYTHONPATH, value: /opt/dlshogi/app}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: PYTHON, value: python}
            - {name: HOME, value: /data/home}
            - {name: WORKDIR, value: /data/rl1}
            - {name: GATE_OPENING, value: /data/openings.txt}
            - {name: GAMES, value: "300"}
            - {name: ITERATIONS, value: "1000"}
            - {name: PLAYOUTS, value: "400"}
            - {name: WORKERS, value: "1"}
            - {name: WINDOW, value: "15"}
            - {name: EPOCHS, value: "1"}
            - {name: BATCHSIZE, value: "1024"}
            - {name: LR, value: "0.002"}
            - {name: VAL_LAMBDA, value: "0.5"}
            - {name: PRUNE_CHECKPOINTS, value: "1"}
            - {name: GATE_GAMES, value: "40"}
            - {name: GATE_PLAYOUTS, value: "400"}
            - {name: GATE_THRESHOLD, value: "0.5"}
            - {name: SELFPLAY_ARGS, value: "--native --backend tensorrt --max_moves 320"}
            - {name: TRAIN_ARGS, value: "--amp --amp_dtype float16 --testbatchsize 1024"}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 8Gi, nvidia.com/gpu: 1}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: app
              mountPath: /opt/dlshogi
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rl1-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: app
          emptyDir: {}
